  deploy-test:
    needs: [build]
    if: github.ref == 'refs/heads/test'
    environment: test
    runs-on: ubuntu-latest
    steps:
    - uses: garygrossgarten/github-action-ssh@0.7.0
      with:
        host: ${{ secrets.AGENCEBIO_PREPROD_SSH_HOST }}
        username: ${{ secrets.AGENCEBIO_SSH_USERNAME }}
        privateKey: ${{ secrets.AGENCEBIO_SSH_PRIVATE_KEY }}
        command: |
          docker pull ${{ needs.build.outputs.image }} \
          && docker stop cartobio-front-test || true \
          && docker container rm cartobio-front-test || true \
          && docker run -d --restart always \
            -p 8080:8080 \
            --name cartobio-front-test \
            ${{ needs.build.outputs.image }}
